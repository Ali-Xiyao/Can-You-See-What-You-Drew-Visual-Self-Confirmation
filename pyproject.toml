[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfsight"
version = "0.1.0"
description = "Controlled visual self-confirmation experiments for unified multimodal models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24,<2.0",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
figure = [
  "SciencePlots>=2.1,<3",
  "pypdf>=4,<7",
]
training = [
  "opencv-python-headless>=4.7,<5",
  "peft==0.11.1",
  "accelerate==0.21.0",
  "transformers==4.41.1",
  "diffusers==0.30.1",
  "safetensors>=0.4,<1",
  "omegaconf==2.3.0",
  "einops>=0.6,<1",
  "jaxtyping==0.2.28",
  "typeguard==2.13.3",
]
observer = [
  "transformers>=4.49,<5",
  "accelerate>=1.2,<2",
  "qwen-vl-utils>=0.0.8",
  "timm>=1,<2",
  "sentencepiece>=0.2,<1",
  "attrdict3==2.0.2",
  "einops>=0.6,<1",
]
showo2 = [
  "transformers==4.47.0",
  "diffusers==0.31.0",
  "einops==0.8.0",
  "sentencepiece==0.2.0",
  "omegaconf==2.3.0",
  "torchdiffeq==0.2.5",
  "accelerate==0.23.0",
  "timm==1.0.12",
  "huggingface-hub==0.24.0",
  "safetensors==0.4.5",
  "peft==0.11.1",
  "opencv-python-headless==4.10.0.84",
]

[project.scripts]
selfsight = "selfsight.cli:main"
selfsight-observer = "selfsight.observers.service:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = [
  "slow: full-scale or subprocess integration test",
  "gpu: requires a CUDA GPU and downloaded model snapshots",
]

[tool.ruff]
line-length = 100
target-version = "py310"
