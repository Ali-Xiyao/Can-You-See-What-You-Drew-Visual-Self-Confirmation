# L3 preview -- underpowered by construction, run to exercise the instrument.
#
# Inherits every model and hardware setting from local_3090_showo2.yaml. What
# differs is the scale, and every difference is forced by the corpus holding
# 228 specs where the registered design wants ~1470 (STATUS 31).
#
# READ THIS BEFORE READING ANY CURVE THIS CONFIG PRODUCES
#
# 10 rounds x 3 optimizer steps is 30 updates on a rank-16 LoRA, of which the
# first 3 are warmup. That is not enough to move the backbone, so two flat
# curves out of this run mean "no training happened", NOT "internal and
# external did not diverge". The preview can falsify the pipeline; it cannot
# falsify the hypothesis, and a null from it must not be written up as one.
#
# The step count is not a knob that was set too low. It is bounded: 76 training
# prompts x 86% gold coverage = 65 distinct selected images for the whole run,
# and buying more steps out of that means showing the same six images per round
# more times, which trains memorisation of six images rather than correctness.
# The fix is more specs, not more steps.

profile: v4_l3_preview
seed: 20260827

paths:
  cache_root: ${SELFSIGHT_CACHE_ROOT}
  data_root: ${SELFSIGHT_DATA_ROOT}
  run_root: ${SELFSIGHT_RUN_ROOT}
  model_root: ${SELFSIGHT_MODEL_ROOT}
  tmp_root: ${SELFSIGHT_TMP_ROOT}

hardware:
  # Measured tonight, and it is the reason this run fits in a day at all:
  # generation is compute-bound, so GPU1 pays 1.36x (18.66 s/img) rather than
  # the 7.5x that STATUS 55 measured for per-image detection. GPU1 draws while
  # GPU0 adjudicates, and the wall clock is the slower of the two, not the sum.
  generator_device: cuda:1
  observer_device: cuda:0
  precision: bf16
  attention: sdpa
  distributed: false

model:
  trainable_id: showlab/show-o2-1.5B
  backbone_config: configs/backbones/showo2_1p5b.yaml
  frozen_negative_control_id: showlab/show-o-w-clip-vit-512x512
  language_base_id: Qwen/Qwen2.5-1.5B-Instruct
  vision_tower_id: google/siglip-so400m-patch14-384
  image_autoencoder_id: Wan-AI/Wan2.1-T2V-14B
  image_resolution: 432
  generation_timesteps: 50
  guidance_scale: 5.0
  temperature: 1.0

data:
  # local_outcome, local_probe and seed are byte-identical to
  # local_3090_showo2.yaml on purpose: split_digest is a function of exactly
  # those three plus the run list, so this config reuses the frozen partition
  # instead of quietly re-drawing it.
  full_train_prompts: 2400
  local_train_prompts: 640
  tier_a_probe: 200
  tier_a_outcome: 600
  local_probe: 32
  local_outcome: 120
  images_per_prompt: 2
  tier_b_pairs: 400
  tier_d_images: 600
  tier_e_images: 200

training:
  # Pass 1 is the positive control, per proposal 7.2. RFO-Self is pass 2.
  arms: [naive, rfo_gold]
  seeds: [20260827]
  rounds: 10
  prompts_per_round: 7
  # 10 x 7 = 70 prompt slots against 76 training prompts, so max_epochs stays 1
  # and no prompt is ever seen twice. This is the one contamination worth
  # spending rounds to avoid: a second pass bends the external curve upward,
  # which is the same direction a real divergence bends it down from.
  candidate_k: 8
  # K=2 leaves the perfect selector with nothing correct to pick in 61% of
  # pools, and the abstentions land on the hard prompts, so the "perfect"
  # selector would be perfect only on the easy 39%. K=8 puts that at 14%.
  optimizer_steps_per_round: 3
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.10
  max_grad_norm: 1.0
  understanding_replay_ratio: 0.25
  gradient_checkpointing: true
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: []
    target_selection_required: true
    forbidden_trainable: [embed_tokens, lm_head, image_embedder_und, und_trans, fusion_proj]

gradient_probe:
  size: 32
  criteria: [naive, rfo, gold]
  noise_floor_splits: 8
  expected_gda_effect: 0.20
  identical_cosine_min: 0.999
  ema_alpha: 0.35

gates:
  verifier_agreement_min: 0.95
  verifier_coverage_min: 0.80
  observer_family_accuracy_min: 0.80
  observer_min_passing_families: 4
  forced_choice_bias_max: 0.10
  observer_abstain_max: 0.20
  family_verifier_coverage_min: 0.70
  oracle_at_4_min: 0.70
  fixed_seed_swing_max: 0.10
  scfr_post_breakpoint_offset_steps: 25
